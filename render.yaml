services:
  - type: web
    name: math-statistics-dashboard
    env: python
    plan: free
    region: singapore
    buildCommand: "./build.sh"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: NODE_VERSION
        value: 20.10.0
