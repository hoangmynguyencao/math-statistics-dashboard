<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="600" rx="28" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="500" y1="0" x2="500" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
    <line x1="700" y1="0" x2="700" y2="600" />
    <line x1="800" y1="0" x2="800" y2="600" />
    <line x1="900" y1="0" x2="900" y2="600" />
    <line x1="1000" y1="0" x2="1000" y2="600" />
    <line x1="1100" y1="0" x2="1100" y2="600" />

    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
  </g>

  <!-- Glowing background circles -->
  <circle cx="950" cy="200" r="180" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>
  <circle cx="300" cy="450" r="160" fill="#06b6d4" opacity="0.12" filter="url(#glow)"/>
  <circle cx="650" cy="180" r="140" fill="#ec4899" opacity="0.10" filter="url(#glow)"/>

  <!-- Left Side: Mathematical Graphics -->
  <!-- Frequency Histogram Bars -->
  <g opacity="0.75">
    <rect x="140" y="380" width="45" height="120" rx="6" fill="url(#barGrad1)" />
    <rect x="200" y="320" width="45" height="180" rx="6" fill="url(#barGrad1)" />
    <rect x="260" y="240" width="45" height="260" rx="6" fill="url(#barGrad2)" />
    <rect x="320" y="180" width="45" height="320" rx="6" fill="url(#barGrad2)" />
    <rect x="380" y="220" width="45" height="280" rx="6" fill="url(#barGrad2)" />
    <rect x="440" y="310" width="45" height="190" rx="6" fill="url(#barGrad1)" />
    <rect x="500" y="400" width="45" height="100" rx="6" fill="url(#barGrad1)" />
    <!-- Horizontal Baseline -->
    <line x1="110" y1="502" x2="570" y2="502" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Smooth Distribution Bell Curve -->
  <path d="M 120 495 C 220 480, 260 380, 342 165 C 380 200, 440 400, 560 495" 
        fill="none" stroke="url(#curveGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#subtleGlow)" />
  <circle cx="342" cy="165" r="7" fill="#ffffff" filter="url(#subtleGlow)" />

  <!-- Right Side: Box Plot Visualization Card -->
  <g transform="translate(640, 140)">
    <!-- Glassmorphic Card Container -->
    <rect width="460" height="340" rx="20" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1.5" />
    
    <!-- Card Header -->
    <text x="35" y="48" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">BIỂU ĐỒ HỘP &amp; PHÂN BỐ TỨ PHÂN VỊ</text>
    <text x="35" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">5 số tóm tắt: Min, Q1, Trung vị Me, Q3, Max</text>

    <!-- Axis Line -->
    <line x1="40" y1="210" x2="420" y2="210" stroke="#475569" stroke-width="2" />
    
    <!-- Whisker Left -->
    <line x1="70" y1="160" x2="140" y2="160" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="70" y1="140" x2="70" y2="180" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <text x="58" y="240" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">x_min</text>

    <!-- The Box (IQR) -->
    <rect x="140" y="120" width="170" height="80" rx="8" fill="#6366f1" fill-opacity="0.35" stroke="#818cf8" stroke-width="3" />
    
    <!-- Median Line (Me = Q2) -->
    <line x1="220" y1="120" x2="220" y2="200" stroke="#ec4899" stroke-width="4" stroke-linecap="round" />
    <text x="202" y="105" fill="#f472b6" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Me = Q₂</text>

    <!-- Q1 and Q3 Labels -->
    <text x="130" y="240" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Q₁</text>
    <text x="300" y="240" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Q₃</text>

    <!-- Whisker Right -->
    <line x1="310" y1="160" x2="380" y2="160" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="380" y1="140" x2="380" y2="180" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <text x="368" y="240" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">x_max</text>

    <!-- Outlier Dot -->
    <circle cx="415" cy="160" r="6" fill="#f43f5e" filter="url(#subtleGlow)"/>
    <text x="390" y="135" fill="#fb7185" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Ngoại lệ</text>

    <!-- Badge info -->
    <rect x="40" y="275" width="380" height="42" rx="10" fill="#0f172a" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <text x="55" y="301" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Khoảng tứ phân vị: Δ_Q = Q₃ - Q₁ | Độ lệch chuẩn s</text>
  </g>

  <!-- Math Floating Symbols & Badges -->
  <g font-family="Georgia, serif" font-style="italic" fill="#ffffff" opacity="0.85">
    <!-- Sigma Badge -->
    <g transform="translate(80, 80)">
      <circle cx="35" cy="35" r="32" fill="#4f46e5" fill-opacity="0.4" stroke="#818cf8" stroke-width="1.5" />
      <text x="24" y="44" font-size="28" font-weight="bold">∑</text>
    </g>

    <!-- Mean Symbol -->
    <g transform="translate(520, 75)">
      <rect width="65" height="50" rx="12" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.5" />
      <text x="21" y="34" font-size="22" font-weight="bold">x̄</text>
    </g>

    <!-- Variance Symbol -->
    <g transform="translate(1030, 80)">
      <circle cx="32" cy="32" r="30" fill="#9333ea" fill-opacity="0.35" stroke="#c084fc" stroke-width="1.5" />
      <text x="19" y="40" font-size="20" font-weight="bold">s²</text>
    </g>
  </g>

  <!-- Title / Tagline at the Bottom -->
  <g transform="translate(70, 545)">
    <rect width="430" height="32" rx="8" fill="#1e1b4b" fill-opacity="0.8" stroke="#4338ca" stroke-width="1" />
    <text x="18" y="21" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">
      CHƯƠNG TRÌNH GDPT 2018 • SGK TOÁN 10 KẾT NỐI TRI THỨC
    </text>
  </g>
</svg>
